# Конфиг для домена vancodex.tech. Кладётся в /etc/nginx/user_conf.d/ образа
# jonasal/nginx-certbot (см. docker-compose.prod.yml) — сам образ находит
# "server_name" в *.conf файлах этой папки и автоматически запрашивает/продлевает
# сертификат Let's Encrypt под эти домены. Руками certbot нигде не запускается.

server {
    listen 80;
    listen [::]:80;
    server_name vancodex.tech;

    # Явный location на случай нестандартной сборки образа — сам образ уже
    # обслуживает ACME HTTP-01 challenge автоматически, это просто fallback.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vancodex.tech;

    ssl_certificate     /etc/letsencrypt/live/vancodex.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vancodex.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 5m;

    # Backend (NestJS) — сервис "app" из docker-compose.prod.yml, порт 3000
    # наружу не публикуется, доступен только внутри docker-сети.
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

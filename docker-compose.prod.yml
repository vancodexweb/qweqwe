# Production-конфигурация для домена vancodex.tech: то же самое, что
# docker-compose.yml (postgres + redis + app), плюс nginx с автоматическим
# HTTPS (образ jonasal/nginx-certbot сам получает и продлевает сертификат
# Let's Encrypt — никаких ручных вызовов certbot).
#
# ВСЁ поднимается одной командой:
#   docker-compose -f docker-compose.prod.yml up --build -d
#
# Единственное условие снаружи Docker: DNS-запись vancodex.tech должна уже
# указывать на IP этого сервера, и на сервере должны быть открыты порты 80/443.
#
# Порты Postgres/Redis/приложения наружу НЕ публикуются — единственная
# публичная точка входа — nginx на 80/443.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auth_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auth_app_password}
      POSTGRES_DB: ${POSTGRES_DB:-auth_app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-auth_app} -d ${POSTGRES_DB:-auth_app}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-auth_app}:${POSTGRES_PASSWORD:-auth_app_password}@postgres:5432/${POSTGRES_DB:-auth_app}?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    # Явные DNS-серверы: на хостах с systemd-resolved (127.0.0.53 в
    # /etc/resolv.conf хоста) Docker иногда не успевает корректно подставить
    # публичный DNS для контейнеров, и любые внешние запросы (в т.ч. к Telegram
    # Bot API) падают с "Temporary failure in name resolution".
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    # :latest — сознательный выбор ради надёжности первого запуска (гарантированно
    # существующий тег). Когда всё заработает, для стабильности стоит зафиксировать
    # конкретную версию — актуальный список тегов: https://hub.docker.com/r/jonasal/nginx-certbot/tags
    image: jonasal/nginx-certbot:latest
    restart: unless-stopped
    environment:
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    # См. комментарий про DNS у сервиса app выше — certbot внутри этого
    # контейнера обращается к acme-v02.api.letsencrypt.org и без этого
    # падает с той же "Temporary failure in name resolution".
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - nginx_secrets:/etc/letsencrypt
      - ./nginx/user_conf.d:/etc/nginx/user_conf.d:ro
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  nginx_secrets:
